<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Word</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='14' height='14' rx='3' fill='%23facc15'/%3E%3Crect x='17' y='1' width='14' height='14' rx='3' fill='%23dc2626'/%3E%3Crect x='1' y='17' width='14' height='14' rx='3' fill='%23a1a1aa'/%3E%3Crect x='17' y='17' width='14' height='14' rx='3' fill='%2316a34a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1 class="logo" aria-label="Word"><b class="unsure">W</b><b class="out">O</b><b>R</b><b class="in">D</b></h1>
      <select id="helper" class="mode" aria-label="Mode">
        <option value="">Normal Mode</option>
        <option value="basic">Basic Helper Mode</option>
        <option value="advanced">Advanced Helper Mode</option>
      </select>
      <button id="reset" class="link" type="button">New game</button>
    </header>

    <input id="word" maxlength="4" placeholder="Guess" aria-label="Your guess"
           autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <p class="label">How many letters are right?</p>
    <div id="counts" class="counts"></div>
    <p id="msg" class="msg"></p>

    <div id="keyboard" class="keyboard"></div>
    <p class="legend">
      Tap to mark:
      <span><i class="out"></i>not in</span>
      <span><i class="unsure"></i>not sure</span>
      <span><i class="in"></i>in word</span>
    </p>

    <h2>Your guesses</h2>
    <ul id="notes" class="notes"></ul>

    <h2><label for="secret">Your secret word</label></h2>
    <div class="secret">
      <input id="secret" type="password" maxlength="4" placeholder="Type it here"
             autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <button id="reveal" class="pill" type="button">Show</button>
    </div>
  </main>
</body>
</html>
