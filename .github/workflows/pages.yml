name: Deploy to GitHub Pages

# Publishes web/ with the version from pyproject.toml stamped into the side
# menu. The Release workflow calls this once a new version is tagged, so only
# released versions go live. Run it by hand to republish the current one.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Stamp the version into the page
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          sed -i "s|<span class=\"version\">dev</span>|<span class=\"version\">v$version</span>|" web/index.html
          grep -q "<span class=\"version\">v$version</span>" web/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v5
