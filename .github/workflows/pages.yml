name: Deploy to GitHub Pages

# Publishes the site with .github/scripts/build_site.py: the latest released
# version at the root, the staging branch at beta/, and a staging copy of every
# other branch under staging/<branch>/, each with its own notes and duel. The Release workflow
# calls this once a new version is tagged, so only released versions go live.
# It also runs after CI on any branch and when a branch is deleted, so the
# staging copies follow their branches. These triggers always run from main,
# the only branch allowed to deploy. Run it by hand to republish.

on:
  workflow_call:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
  delete:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Every tag and branch, to build the live site and the staging copies from
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Build the site
        run: uv run --no-project python .github/scripts/build_site.py _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
