name: Deploy to GitHub Pages

# Publishes the site with .github/scripts/build_site.py: the latest released
# version at the root, the staging branch at beta/, and a staging copy of every
# other branch under staging/<branch>/, each with its own notes and duel. The Release workflow
# calls this once a new version is tagged, so only released versions go live.
# It also runs after CI passes on a push to any branch but main (main goes live
# only through a release) and when a branch is deleted, so the staging copies
# follow their branches. These triggers always run from main, the only branch
# allowed to deploy. Run it by hand to republish.

on:
  workflow_call:
  workflow_dispatch:
  # Not after CI on main: those runs would only be skipped below
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches-ignore: [main]
  delete:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # After CI, deploy only for a passing push to a branch other than main:
    # main goes live only through a release, which the Release workflow
    # deploys itself.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch != 'main')
    # One deploy at a time, and one that has started always finishes. The queue
    # is the job's, not the workflow's: a run whose job is skipped (after a pull
    # request's CI, say) never joins it, so it can't cancel a real deploy. A
    # deploy still waiting gives way to a newer one, which builds every branch
    # at its latest anyway.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Every tag and branch, to build the live site and the staging copies from
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Build the site
        run: uv run --no-project python .github/scripts/build_site.py _site

      # One artifact name per attempt, or a re-run finds the first attempt's too
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
