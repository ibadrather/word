name: CI

# Lint, type check and test on every push to any branch - but only when
# something that can change the result changed: the page, the tests, the
# scripts, the tooling config or this workflow. A README change alone skips it.
# A pull request's branch is pushed here too, and its push run's checks show on
# the pull request, so there's no pull_request trigger to run them all twice.
# The Release workflow calls this too, so nothing ships without it.

on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - "tests/**"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-lint

      - name: Install
        run: uv sync --locked

      - name: Formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check --output-format=github

  lint-js:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: ESLint
        run: npx eslint --max-warnings 0 .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-typecheck

      - name: Install
        run: uv sync --locked

      - name: mypy
        run: uv run mypy tests .github/scripts

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The helper tests run the page's JavaScript; without Node they'd be
      # skipped, so CI pins one rather than relying on the runner image.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-test

      - name: Install
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -rs
