[project]
name = "word"
version = "1.16.1"
description = "Word notes and a colour-marking keyboard for a two-player word guessing game"
readme = "README.md"
authors = [
    { name = "Ibad Rather", email = "ibad.rather.ir@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false  # a static site in web/; Python is only for the tests

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "packaging>=26.0",  # the version-bump check in .github/scripts
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # no copyright header for a personal project
    "D203",   # conflicts with D211 (no blank line before class docstring)
    "D213",   # conflicts with D212 (summary on the first docstring line)
]

[tool.ruff.lint.per-file-ignores]
".github/scripts/**" = [
    "INP001",  # standalone scripts, not a package
    "PLR0911", # one early return per outcome reads best in a check
    "S603",    # git with our own arguments
    "S607",    # git from PATH, as on the runner
    "T201",    # CI scripts report by printing
]
"tests/**" = [
    "INP001", # tests are not a package
    "S101",   # pytest uses assert
]

[tool.mypy]
strict = true
